services:
  lab-simulator:
    image: python:3.13-slim
    restart: unless-stopped
    mem_limit: 64m
    user: "65534:65534"
    read_only: true
    ports:
      - "127.0.0.1:18083:8083"
    volumes:
      - ./injects/simulateur/simulator.py:/app/simulator.py:ro
      - ./injects/simulateur/state:/state:ro
    command: ["python", "-u", "/app/simulator.py"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
